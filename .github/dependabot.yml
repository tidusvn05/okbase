# Weekly dependency updates. Rust updates still need the checks in AGENTS.md (and eval data for
# anything that changes search or ranking); GitHub Actions updates are grouped.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
    groups:
      actions:
        patterns: ["*"]
