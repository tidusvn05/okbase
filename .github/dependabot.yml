# Weekly dependency updates. Rust updates still need the checks in AGENTS.md (and eval data for
# anything that changes search or ranking); GitHub Actions updates are grouped.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    ignore:
      # Must stay on the version htmd uses (htmd 0.5 needs markup5ever_rcdom 0.38).
      - dependency-name: markup5ever_rcdom
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
    ignore:
      # Its ref is a Rust toolchain (stable, or 1.89 for the MSRV job), not an action version.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
