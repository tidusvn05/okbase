name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --no-fail-fast

  full:
    # The okbase-full build: local embeddings (ONNX Runtime) and fine-tuning.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p okbase-cli --features full
      - run: cargo test -p okbase-embed -p okbase-search -p okbase --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  installer:
    # install.sh against a local copy of a release (checksums, layout, options).
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh
        if: runner.os == 'Linux'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p okbase-cli
      - name: Install from a local release
        shell: bash
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          name="okbase-v0.0.0-$target"
          mkdir -p "rel/v0.0.0/$name" home
          cp target/release/okbase "rel/v0.0.0/$name/"
          (cd rel/v0.0.0 && tar -czf "$name.tar.gz" "$name" && rm -r "$name" && shasum -a 256 "$name.tar.gz" > SHA256SUMS)
          HOME="$PWD/home" OKBASE_DOWNLOAD_URL="file://$PWD/rel" sh install.sh --version v0.0.0
          "$PWD/home/.local/bin/okbase" --version
          echo tampered >> "rel/v0.0.0/$name.tar.gz"
          if HOME="$PWD/home" OKBASE_DOWNLOAD_URL="file://$PWD/rel" sh install.sh --version v0.0.0; then
            echo "::error::a tampered archive was installed"; exit 1
          fi
