name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-rc.N) builds the okbase and okbase-full binaries for every
# supported platform, attaches them with SHA256SUMS to a GitHub release, and writes the release
# notes from the commits since the previous tag. The procedure is in docs/releasing.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag; resumes only missing outputs, never replaces published assets"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # ONNX Runtime version linked by the `ort` crate (okbase-full); its notices ship in the archive.
  ORT_VERSION: "1.28.0"

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      binaries: ${{ steps.tag.outputs.binaries }}
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate tag, main ancestry, versions and changelog
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/check-release.py "$RELEASE_TAG"
      - run: cargo install --locked cargo-deny
      - run: scripts/verify.sh
      - run: scripts/release.py publish --dry-run

  build:
    name: Build ${{ matrix.variant }} ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.binaries == 'true'
    strategy:
      fail-fast: false
      matrix:
        variant: [okbase, okbase-full]
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
        include:
          # Older Ubuntu images keep the glibc requirement low.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          # Intel Macs: cross-compiled on Apple silicon (Intel runners are being retired).
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # okbase-full links ONNX Runtime's prebuilt library, which needs glibc 2.38 or newer;
          # built on ubuntu-24.04, okbase-full needs glibc 2.39 or newer.
          - { variant: okbase-full, target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { variant: okbase-full, target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
        exclude:
          # ONNX Runtime has no prebuilt library for Intel Macs.
          - { variant: okbase-full, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}-${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          features=""
          if [ "${{ matrix.variant }}" = "okbase-full" ]; then features="--features full"; fi
          cargo build --release --locked -p okbase-cli --target ${{ matrix.target }} $features
      - name: Third-party licenses
        shell: bash
        run: |
          cargo install --locked cargo-about --features cli
          features=""
          if [ "${{ matrix.variant }}" = "okbase-full" ]; then features="--features full"; fi
          cargo about generate --manifest-path crates/okbase-cli/Cargo.toml $features \
            --target ${{ matrix.target }} packaging/about.hbs -o THIRD_PARTY_LICENSES.md
      - name: Package
        shell: bash
        run: |
          name="${{ matrix.variant }}-$TAG-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=okbase; [[ "${{ matrix.target }}" == *windows* ]] && exe=okbase.exe
          cp "target/${{ matrix.target }}/release/$exe" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY.md THIRD_PARTY_LICENSES.md CHANGELOG.md "dist/$name/"
          if [ "${{ matrix.variant }}" = "okbase-full" ]; then
            mkdir -p "dist/$name/licenses"
            cp licenses/ONNXRUNTIME.txt "dist/$name/licenses/"
            curl -fsSL "https://raw.githubusercontent.com/microsoft/onnxruntime/v$ORT_VERSION/ThirdPartyNotices.txt" \
              -o "dist/$name/licenses/ONNXRUNTIME-ThirdPartyNotices.txt"
          fi
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [check, build]
    if: always() && needs.check.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: needs.check.outputs.binaries == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Source archive
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="okbase-$TAG/" "$TAG" -o "dist/okbase-$TAG-source.tar.gz"
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          # Authentication/network failures must not be mistaken for an absent release.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python3 - <<'PYTHON'
          import json, os
          existing = [r for page in json.load(open("releases.json")) for r in page if r["tag_name"] == os.environ["TAG"]]
          if existing and existing[0]["draft"]:
              raise SystemExit("existing draft requires operator review; assets will not be overwritten")
          if existing:
              if existing[0]["prerelease"] != ("-" in os.environ["TAG"]):
                  raise SystemExit("existing release has wrong prerelease state")
              if not existing[0]["body"]:
                  raise SystemExit("existing release has no notes")
              expected = {p.name for p in __import__("pathlib").Path("dist").iterdir()} | {"SHA256SUMS"}
              actual = {a["name"] for a in existing[0]["assets"]}
              if expected != actual:
                  raise SystemExit("existing release has different assets; fix forward, never overwrite")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"exists={str(bool(existing)).lower()}\n")
          PYTHON
      - name: Verify immutable existing assets
        if: steps.existing.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release download "$TAG" --dir existing-assets
          (cd existing-assets && sha256sum --check SHA256SUMS)
      - name: Checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes (git-cliff)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: NOTES.md
      - name: Install instructions
        run: |
          cat >> NOTES.md <<EOF

          ## Install

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh -s -- --version ${{ needs.check.outputs.tag }}
          \`\`\`

          Add \`--full\` for okbase-full (semantic search and fine-tuning; Linux with glibc 2.39+,
          Apple silicon and Windows). Windows:
          \`irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex\`.
          Every archive is listed in \`SHA256SUMS\`.

          With Rust 1.89 or newer, install the CLI from crates.io:
          \`cargo install --locked --version ${{ needs.check.outputs.version }} okbase-cli\`
          (add \`--features full\` for semantic search and fine-tuning).
          Rust library: [okbase](https://crates.io/crates/okbase/${{ needs.check.outputs.version }}).
          EOF
      - uses: softprops/action-gh-release@v3
        if: steps.existing.outputs.exists != 'true'
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: okbase ${{ needs.check.outputs.tag }}
          body_path: NOTES.md
          prerelease: ${{ needs.check.outputs.prerelease }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  crates:
    name: Publish to crates.io
    needs: [check, release]
    # Pre-releases (vX.Y.Z-rc.N) are not published to crates.io.
    if: needs.check.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # crates.io Trusted Publishing: each crate trusts this repository, this workflow file and this
    # environment (docs/releasing.md), so no API token is stored anywhere.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Crates to publish
        id: pending
        run: |
          scripts/release.py pending
          new="$(sed -n 's/^new=//p' "$GITHUB_OUTPUT" | tail -1)"
          if [ -n "$new" ]; then
            echo "::error::not on crates.io yet: $new. Trusted Publishing cannot create a crate: publish it once by hand (docs/releasing.md, 'A new crate'), then re-run this job."
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.pending.outputs.count != '0'
      - uses: Swatinem/rust-cache@v2
      - run: scripts/release.py publish
        if: steps.pending.outputs.count != '0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
