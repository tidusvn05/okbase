name: Bug report
description: okbase does something wrong or fails
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected and what you got (paste the output; `--json` output and the exit code help).
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A small bundle or the steps that show the problem. Remove anything private.
  - type: input
    id: version
    attributes:
      label: okbase version
      description: Output of `okbase --version`, and whether it is okbase or okbase-full.
    validations: { required: true }
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and CPU, and the agent if it matters (Claude Code, Codex and their versions).
  - type: textarea
    id: doctor
    attributes:
      label: okbase doctor
      description: Output of `okbase doctor` in the bundle, if the problem is about setup.
