# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is a compile-time proc macro (no runtime code), unmaintained but with no known
    # vulnerability; it comes from `tokenizers` via fastembed, only in the opt-in embed-local module.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc macro via tokenizers (embed-local only)" },
    # `ttf-parser` (font tables inside PDFs) comes from pdf-inspector via anydoc in okbase-convert.
    # Unmaintained, no known vulnerability, built for untrusted input; drop this when
    # pdf-inspector moves to `skrifa`.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained font parser via pdf-inspector (import); no known vulnerability" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Allowlist from docs/PLAN.md §17. MPL-2.0 only for unmodified dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

# Mozilla's CA bundle, used only at build time by lindera to download the IPADIC dictionary.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # TLS must go through rustls (AGENTS.md hard rule 6).
    { crate = "openssl", reason = "use rustls" },
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
    # YAML must go through serde-saphyr.
    { crate = "serde_yaml", reason = "use serde-saphyr" },
    { crate = "serde_yml", reason = "use serde-saphyr" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
