[package]
name = "embed-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
candle-core = "0.11"
fastembed = { version = "7.1", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls", "qwen3", "nomic-v2-moe"] }
lindera = { version = "6", features = ["embed-ipadic"] }
lingua = { version = "1.8", default-features = false, features = ["english", "japanese", "vietnamese"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
unicode-normalization = "0.1.25"
