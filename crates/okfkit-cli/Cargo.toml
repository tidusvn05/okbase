[package]
name = "okfkit-cli"
description = "Command-line interface for okfkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[[bin]]
name = "okfkit"
path = "src/main.rs"

[dependencies]
okfkit.workspace = true
okfkit-mcp.workspace = true
okfkit-skills.workspace = true
okfkit-lint.workspace = true
okfkit-adopt.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
tempfile.workspace = true
serde_json.workspace = true
okfkit.workspace = true
okfkit-mcp.workspace = true

[features]
## Local embedding models (ONNX Runtime): `okfkit embed`, `search`, `retrieve`, kb_search.
embed-local = ["okfkit/embed-local"]
## An OpenAI-compatible embeddings API.
embed-api = ["okfkit/embed-api"]
## Fine-tuning (train/export through a private Python environment).
embed-tune = ["okfkit/embed-tune"]
## Everything: the okfkit-full build. Language dictionaries stay external (downloaded on first
## use), as in the default build.
full = ["embed-local", "embed-api", "embed-tune"]
