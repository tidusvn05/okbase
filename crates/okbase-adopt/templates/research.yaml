id: "research"
title: "Atlas research and investigations"
description: "Keep research questions, hypotheses, experiments and recommendations connected to reproducible evidence."
roles: ["developer", "product-manager", "leader"]
schemas:
  Decision: {"owner": {"type": "string", "required": true}, "project_id": "string", "decision_status": {"type": "string", "required": true, "enum": ["proposed", "accepted", "superseded"]}}
  Evidence: {"owner": "string", "project_id": "string"}
  Experiment: {"owner": "string", "project_id": "string"}
  Guide: {"owner": "string", "project_id": "string", "audience": "string"}
  Hypothesis: {"owner": "string", "project_id": "string"}
  Reference: {"owner": "string", "project_id": "string"}
  Research: {"owner": "string", "project_id": "string"}
vocabulary: {"research": [], "question": [], "hypothesis": [], "monitoring": [], "experiment": [], "reproducibility": [], "evidence": [], "result": [], "limitations": [], "decision": [], "recommendation": []}
documents:
  - path: "research/question.md"
    type: "Research"
    title: "Retry monitoring research question"
    description: "Define the decision to inform and the observable behavior the investigation must explain."
    tags: ["research", "question"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Question
      Which retry-age definition reveals an old pending event when recent events are being delivered successfully?
      The decision is whether to use last-attempt age or oldest-pending-event age for the Atlas dashboard.
      Read the [hypothesis](../hypotheses/old-events.md), [experiment](../experiments/retry-age.md), and [evidence record](../evidence/demo-result.md). This is a fictional worked example, not a production benchmark.
  - path: "hypotheses/old-events.md"
    type: "Hypothesis"
    title: "Recent retries can hide old pending events"
    description: "State a falsifiable hypothesis separately from observed experiment results."
    tags: ["hypothesis", "monitoring"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Hypothesis
      Measuring only the latest retry attempt can hide an older event that is still pending.
      Falsify this by testing a query that claims to measure backlog age against both an old pending event and a recent successfully delivered event.
      ## Evidence boundary
      A plausible mechanism is not a confirmed production incident cause. Read the [experiment protocol](../experiments/retry-age.md) and [results](../evidence/demo-result.md) before drawing a conclusion.
  - path: "experiments/retry-age.md"
    type: "Experiment"
    title: "Two-event retry-age experiment"
    description: "Specify the small input set and expected observations needed to compare monitoring definitions."
    tags: ["experiment", "reproducibility"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Input and fixed clock
      At a fixed clock of 12:00 UTC, event A has been pending since 10:00 UTC; event B was created at 11:59 UTC and delivered at 12:00 UTC.
      ## Expected comparison
      Oldest pending event age should be 120 minutes; latest successful attempt age is zero minutes.
      Run candidate queries against this exact fixture and preserve the query text, clock and result. The demo records the hand-calculated expectation; no live query was executed.
      Read the [evidence record](../evidence/demo-result.md) and [limitations](../research/limitations.md).
  - path: "evidence/demo-result.md"
    type: "Evidence"
    title: "Demo experiment evidence"
    description: "Separate a hand-calculated expected result from an executed measurement."
    tags: ["evidence", "result"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Evidence type
      This record contains hand-calculated expected results, not measured production data.
      Event A remains pending for 120 minutes; event B's successful attempt is zero minutes old at the fixed clock.
      ## Missing artifacts
      The production query, real event export and execution log are not attached. The [hypothesis](../hypotheses/old-events.md) therefore remains unverified in production.
      Use the [experiment protocol](../experiments/retry-age.md) for a real run and preserve the actual outputs before updating the [recommendation](../decisions/monitoring-definition.md).
  - path: "research/limitations.md"
    type: "Reference"
    title: "Research limitations and missing evidence"
    description: "Document what the example can establish and what a production decision still requires."
    tags: ["limitations", "evidence"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Limits
      The two-event example demonstrates a semantic difference; it does not establish production query performance, incident frequency or customer impact.
      No actual event export, query plan or traffic distribution is available in this template.
      ## Next evidence
      Obtain a redacted production sample and the candidate queries, then repeat the [experiment](../experiments/retry-age.md). Report results under a fixed clock and retain the [research question](question.md) as the decision boundary.
  - path: "decisions/monitoring-definition.md"
    type: "Decision"
    title: "Propose oldest pending event age"
    description: "Link a provisional monitoring recommendation to its supporting example and missing production validation."
    tags: ["decision", "recommendation"]
    fields: {"owner": "atlas-team", "project_id": "atlas", "decision_status": "proposed"}
    body: |
      ## Proposal
      Use oldest pending event age for backlog visibility, subject to validation with the real query and event export.
      The two-event example shows why recent successful attempts can hide old pending work. It does not show that the current production dashboard is incorrect.
      ## Acceptance condition
      The designated reviewer must inspect a real query result and its limitations before accepting the decision.
      Sources: [experiment](../experiments/retry-age.md), [evidence](../evidence/demo-result.md), [limitations](../research/limitations.md).
questions:
  - question: "What research question is being investigated?"
    source: "research/question"
    evidence: "Which retry-age definition reveals an old pending event"
  - question: "What is the hypothesis?"
    source: "hypotheses/old-events"
    evidence: "Measuring only the latest retry attempt can hide an older event"
  - question: "What should the oldest pending age be in the fixture?"
    source: "experiments/retry-age"
    evidence: "Oldest pending event age should be 120 minutes"
  - question: "Are these measured production results?"
    source: "evidence/demo-result"
    evidence: "hand-calculated expected results, not measured production data"
  - question: "What must happen before accepting the recommendation?"
    source: "decisions/monitoring-definition"
    evidence: "inspect a real query result and its limitations"
workflows:
  - id: "frame-investigation"
    title: "Frame an investigation"
    description: "Write a falsifiable question and keep assumptions separate from observations."
    steps: ["Read the research question and current evidence limits.", "Define the decision, hypothesis, observable input and result that would falsify it.", "Create or update authorized records with source links; do not treat a plausible mechanism as a confirmed finding."]
    sources: ["research/question", "hypotheses/old-events", "research/limitations"]
  - id: "record-experiment"
    title: "Record a reproducible experiment"
    description: "Preserve inputs, procedure, clock and actual output so the result can be checked."
    steps: ["Read the protocol and expected result.", "Run only available, authorized tools against the approved data; record actual commands and outputs separately from expectations.", "Update the evidence record with artifact references, observation date and limitations; keep failed or inconclusive results visible."]
    sources: ["experiments/retry-age", "evidence/demo-result", "research/limitations"]
  - id: "write-recommendation"
    title: "Write an evidence-based recommendation"
    description: "Connect a decision proposal to observations, alternatives and remaining uncertainty."
    steps: ["Read the question, hypothesis and actual experiment evidence.", "Describe what the evidence supports, alternatives and what remains unknown.", "Write the authorized recommendation with source links and acceptance conditions; set decision_status to accepted only after its reviewer approves."]
    sources: ["decisions/monitoring-definition", "evidence/demo-result", "research/limitations"]
