    source: "strategy/direction"
    evidence: "reliable issue handoffs for small engineering teams"
  - question: "Has a numerical production target been approved?"
    source: "objectives/q4"
    evidence: "no numerical production target has been approved"
  - question: "How is reliable notification rate defined?"
    source: "metrics/reliable-notifications"
    evidence: "delivered exactly once divided by distinct accepted assignment events"
  - question: "What is the accepted M1 scope decision?"
    source: "decisions/m1-scope"
    evidence: "Keep digest emails outside M1 until notification reliability is measurable."
  - question: "What KPI value can the weekly briefing substantiate?"
    source: "reports/week-42"
    evidence: "The reliability KPI value is unknown"
workflows:
  - id: "prepare-briefing"
    title: "Prepare an executive briefing"
    description: "Connect strategic outcomes to dated evidence and a concrete decision request."
    steps: ["Read strategy, objectives, initiatives and the previous report.", "Check KPI definitions and actual evidence; list unknown values explicitly.", "Draft the briefing with reporting dates, source links, risks and the decision required; do not invent financial or customer outcomes."]
    sources: ["strategy/direction", "metrics/reliable-notifications", "reports/week-42"]
  - id: "record-decision"
    title: "Record an executive decision"
    description: "Preserve the alternatives, rationale, owner and revisit condition for a leadership choice."
    steps: ["Locate the objective, initiative and existing decision.", "Prepare alternatives and evidence limits, including the consequences of deferring the choice.", "Record the approved outcome and affected source links within write authorization; keep operational permissions with the execution host."]
    sources: ["objectives/q4", "decisions/m1-scope", "initiatives/m1"]
  - id: "review-objective"
    title: "Review an objective and its KPI"
    description: "Evaluate progress against a defined outcome rather than task counts alone."
    steps: ["Read the objective and metric definition, including denominator and measurement window.", "Check the dated source export or state clearly that it is unavailable.", "Write an evidence-based review and owner-assigned follow-up; preserve the distinction between delivery progress and business outcome."]
    sources: ["objectives/q4", "metrics/reliable-notifications", "risks/metric-evidence"]
