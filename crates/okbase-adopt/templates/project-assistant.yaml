id: "project-assistant"
title: "Atlas project assistant"
description: "Maintain linked tasks, decisions, investigations and evidence-based project reports."
roles: ["developer", "project-manager", "leader"]
schemas:
  Decision: {"owner": {"type": "string", "required": true}, "project_id": "string", "decision_status": {"type": "string", "required": true, "enum": ["proposed", "accepted", "superseded"]}}
  Guide: {"owner": "string", "project_id": "string", "audience": "string"}
  Investigation: {"owner": {"type": "string", "required": true}, "project_id": "string", "investigation_status": {"type": "string", "required": true, "enum": ["open", "investigating", "concluded"]}, "finding_kind": {"type": "string", "enum": ["hypothesis", "confirmed", "inconclusive"]}}
  Meeting: {"owner": "string", "project_id": "string"}
  Reference: {"owner": "string", "project_id": "string"}
  Report: {"owner": {"type": "string", "required": true}, "project_id": "string", "period_start": {"type": "date", "required": true}, "period_end": {"type": "date", "required": true}, "as_of": {"type": "date", "required": true}}
  Task: {"owner": {"type": "string", "required": true}, "project_id": {"type": "string", "required": true}, "task_status": {"type": "string", "required": true, "enum": ["todo", "in_progress", "blocked", "done", "cancelled"]}, "priority": {"type": "string", "enum": ["high", "normal", "low"]}, "due": "date"}
vocabulary: {"project": [], "ownership": [], "meeting": [], "decision": [], "task": [], "reliability": [], "monitoring": [], "scope": [], "investigation": [], "report": [], "delivery": []}
documents:
  - path: "project/context.md"
    type: "Reference"
    title: "Atlas delivery context"
    description: "Recover the milestone boundary, ownership and current delivery goal."
    tags: ["project", "ownership"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Milestone
      Atlas M1 delivers reliable issue notifications. The api-team owns issue writes; the platform-team owns deployment and operational evidence.
      The milestone is accepted only when duplicate events do not send duplicate notifications and retry-age monitoring has been reviewed.
      Read the [planning meeting](../meetings/m1-planning.md), [retry task](../tasks/at-42.md), and [dashboard task](../tasks/at-43.md). The [weekly report](../reports/week-42.md) summarizes evidence, not a separate source of task truth.
  - path: "meetings/m1-planning.md"
    type: "Meeting"
    title: "M1 planning meeting"
    description: "Trace meeting outcomes to owners, tasks and the delivery decision."
    tags: ["meeting", "decision"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Outcomes on 2026-10-12
      The team agreed to preserve the M1 notification scope and defer digest emails.
      Mina owns AT-42: make worker retries idempotent. Leo owns AT-43: validate the retry-age dashboard. The dashboard review depends on the instrumentation export.
      ## Follow-through
      The scope choice is recorded in [DEC-01](../decisions/m1-scope.md). Track execution in [AT-42](../tasks/at-42.md) and [AT-43](../tasks/at-43.md); editing this meeting must not silently change task states.
  - path: "tasks/at-42.md"
    type: "Task"
    title: "AT-42: idempotent worker retry"
    description: "Track the finished idempotency task and the evidence supporting its completion."
    tags: ["task", "reliability"]
    fields: {"owner": "mina", "project_id": "atlas", "task_status": "done", "priority": "high", "due": "2026-10-16"}
    body: |
      ## Acceptance
      Delivering the same outbox event twice must create only one external notification.
      ## Outcome
      AT-42 is done: the duplicate-delivery test passed at example commit demo-a142.
      Source: fictional test summary reviewed in the [planning follow-up](../meetings/m1-planning.md). This demo contains no actual application checkout or executable test evidence.
      The remaining [dashboard task](at-43.md) is independently blocked; AT-42 completion does not unblock it.
  - path: "tasks/at-43.md"
    type: "Task"
    title: "AT-43: validate retry-age monitoring"
    description: "Track the blocked dashboard task, its missing input and the responsible owner."
    tags: ["task", "monitoring"]
    fields: {"owner": "leo", "project_id": "atlas", "task_status": "blocked", "priority": "high", "due": "2026-10-16"}
    body: |
      ## Blocker
      AT-43 is blocked pending the instrumentation export from the platform-team.
      Owner Leo must obtain the query and a redacted sample before validating the retry-age calculation. Due date: 2026-10-16.
      ## Next action
      Request the missing evidence through an authorized communication tool; this knowledge bundle does not send that request itself.
      See [INV-01](../investigations/retry-age.md) for the hypothesis and [the delivery report](../reports/week-42.md) for its milestone impact.
  - path: "decisions/m1-scope.md"
    type: "Decision"
    title: "DEC-01: defer digest emails"
    description: "Record the milestone scope decision and its implications for delivery reporting."
    tags: ["decision", "scope"]
    fields: {"owner": "atlas-team", "project_id": "atlas", "decision_status": "accepted"}
    body: |
      ## Accepted decision
      Digest emails are deferred until after M1; retry correctness and monitoring remain in scope.
      Source: [M1 planning](../meetings/m1-planning.md). The reason is to finish the notification reliability evidence before adding a second notification mode.
      ## Implications
      Do not count digest email work as an M1 blocker. Do count [AT-43](../tasks/at-43.md), because monitoring is part of acceptance.
  - path: "investigations/retry-age.md"
    type: "Investigation"
    title: "INV-01: retry-age calculation"
    description: "Separate a monitoring hypothesis from confirmed evidence and its follow-up task."
    tags: ["investigation", "monitoring"]
    fields: {"owner": "atlas-team", "project_id": "atlas", "investigation_status": "investigating", "finding_kind": "hypothesis"}
    body: |
      ## Question
      Does the dashboard measure the age of the oldest pending retry or only recently retried events?
      ## Evidence and hypothesis
      The exported query is missing. The hypothesis is that recent successful retries hide older pending events; this has not been confirmed.
      ## Next experiment
      Inspect the query, then compare it with a sample containing one old pending event and one recent successful event. Record inputs, expected result and actual result before concluding.
      The work is tracked by [AT-43](../tasks/at-43.md) and summarized in the [weekly report](../reports/week-42.md).
  - path: "reports/week-42.md"
    type: "Report"
    title: "Atlas week 42 delivery report"
    description: "Summarize delivery using task states, the accepted scope and explicit evidence gaps."
    tags: ["report", "delivery"]
    fields: {"owner": "atlas-team", "project_id": "atlas", "period_start": "2026-10-12", "period_end": "2026-10-16", "as_of": "2026-10-14"}
    body: |
      ## Snapshot
      Reporting period: 2026-10-12 through 2026-10-16. Evidence cutoff: 2026-10-14.
      One task is done and one task is blocked in this demo snapshot.
      [AT-42](../tasks/at-42.md) records the completed retry work. [AT-43](../tasks/at-43.md) is waiting for the instrumentation export; the monitoring conclusion remains unknown.
      ## Decision needed
      The milestone cannot be declared accepted until the monitoring evidence is reviewed. [DEC-01](../decisions/m1-scope.md) excludes digest emails from this milestone.
      This report does not imply that the fictional test results or external issue tracker have been independently verified.
questions:
  - question: "What does M1 deliver?"
    source: "project/context"
    evidence: "Atlas M1 delivers reliable issue notifications."
  - question: "Which task is complete?"
    source: "tasks/at-42"
    evidence: "AT-42 is done"
  - question: "Why is AT-43 blocked?"
    source: "tasks/at-43"
    evidence: "pending the instrumentation export from the platform-team"
  - question: "Are digest emails an M1 blocker?"
    source: "decisions/m1-scope"
    evidence: "Digest emails are deferred until after M1"
  - question: "How many tasks are done and blocked in the report?"
    source: "reports/week-42"
    evidence: "One task is done and one task is blocked"
workflows:
  - id: "meeting-to-tasks"
    title: "Turn a meeting into tracked work"
    description: "Create linked decisions and owner-assigned tasks without losing the source meeting."
    steps: ["Read meeting outcomes and existing tasks; check for duplicate work.", "Propose separate decisions and tasks with owner, acceptance criteria, due date and task_status.", "With write authorization, update the records and link them back to the meeting; leave unknown owners or dates explicitly unresolved."]
    sources: ["meetings/m1-planning", "tasks/at-42", "tasks/at-43", "decisions/m1-scope"]
  - id: "weekly-report"
    title: "Prepare a project status report"
    description: "Generate a source-backed report from current task states and decisions."
    steps: ["Query tasks with `okbase query --type Task --facet task_status` and inspect blockers.", "Read the milestone and accepted decisions, then choose the reporting period and evidence cutoff.", "Write an authorized report citing task and investigation IDs; do not infer completion from a meeting promise or a missing external update."]
    sources: ["project/context", "reports/week-42", "tasks/at-43"]
  - id: "investigate-blocker"
    title: "Investigate a delivery blocker"
    description: "Track evidence, hypotheses and the next experiment alongside the blocked task."
    steps: ["Read the task, its dependency and existing investigation.", "List observed evidence separately from hypotheses; use external log or tracker tools only if available and authorized.", "Record experiment results, update the task only when its acceptance evidence changes, and refresh affected documentation and reports."]
    sources: ["tasks/at-43", "investigations/retry-age", "reports/week-42"]
