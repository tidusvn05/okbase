    title: "Onboard a developer"
    description: "Build an accurate mental model before modifying the software."
    steps: ["Read the overview, architecture and ownership records.", "Trace one create request through the API, transaction and outbox.", "Identify missing setup commands and ask the owner; do not invent runnable scripts."]
    sources: ["project/overview", "architecture/system", "development/local-setup"]
  - id: "change-contract"
    title: "Change an API safely"
    description: "Connect a behavior change to its decision, tests and documentation."
    steps: ["Read the current API contract and storage decision.", "Write the proposed behavior and compatibility impact; update the ADR if the rationale changes.", "With write authorization, update the contract, model and tests together; retain the old behavior until migration is agreed."]
    sources: ["api/issues", "decisions/postgresql", "data-model/issues", "development/testing"]
  - id: "prepare-release"
    title: "Prepare a release review"
    description: "Collect compatibility evidence and a concrete rollback boundary."
    steps: ["Read the release checklist and test evidence for the proposed commit.", "List blockers, migration constraints and the previous artifact.", "Write a release brief with evidence and outstanding approvals; deployment is performed by the authorized external tooling."]
    sources: ["delivery/release", "development/testing"]
