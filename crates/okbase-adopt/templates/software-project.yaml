documents:
  - path: "project/overview.md"
    type: "Reference"
    title: "Atlas project overview"
    description: "Understand the Atlas issue-tracking product, its boundaries and component owners."
    tags: ["project", "ownership"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Purpose and boundaries
      Atlas is a fictional issue tracker for small engineering teams. The first release supports projects, issues and comments; billing is outside this release.
      The Atlas API owns writes and a worker sends notifications. Web clients call the API over HTTPS; they never access the database directly.
      ## Where to start
      Read the [architecture](../architecture/system.md), [storage decision](../decisions/postgresql.md), and [API contract](../api/issues.md). The api-team owns API behavior; the platform-team owns deployment.
      Before changing behavior, locate its owner and acceptance criteria, then check the [release checklist](../delivery/release.md).
  - path: "architecture/system.md"
    type: "Reference"
    title: "Atlas system architecture"
    description: "Trace request and notification paths across the web client, API, database and worker."
    tags: ["architecture", "dependencies"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Request path
      The request path is web client -> Atlas API -> PostgreSQL. Successful writes add an outbox row in the same transaction; the worker reads the outbox and sends notifications.
      The API is stateless. PostgreSQL stores durable issues and outbox records; Redis holds disposable rate-limit counters only.
      ## Failure boundaries
      A notification failure must not roll back an accepted issue. The worker retries with the event ID as its idempotency key.
      See [the storage ADR](../decisions/postgresql.md), [the data model](../data-model/issues.md), and [API error behavior](../api/issues.md).
  - path: "decisions/postgresql.md"
    type: "Decision"
    title: "Use PostgreSQL for issues and the outbox"
    description: "Explain the storage choice, rejected alternative and conditions for reconsideration."
    tags: ["architecture", "decision"]
    fields: {"owner": "atlas-team", "project_id": "atlas", "decision_status": "accepted"}
    body: |
      ## Decision
      PostgreSQL keeps the issue write and outbox insert in one transaction.
      We chose it over a document store because a lost outbox event would leave users with accepted issues but missing notifications. A queue-only design would introduce a second durable-write boundary.
      ## Reconsider when
      Revisit this decision if the measured write workload exceeds the capacity of the current primary after query and index tuning. Do not migrate based on an unmeasured scaling concern.
      The [architecture](../architecture/system.md) and [data model](../data-model/issues.md) depend on this decision.
  - path: "api/issues.md"
    type: "API"
    title: "Create issue API contract"
    description: "Specify issue creation, idempotency, errors and compatibility expectations."
    tags: ["api", "contract"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## POST /v1/issues
      Required fields: project_id, title. The authenticated principal must have write access to the project. A successful response is HTTP 201 with issue_id and version.
      An Idempotency-Key is required for retried create requests. Repeating the same key and payload returns the original issue; repeating a key with a different payload returns HTTP 409.
      ## Validation and compatibility
      An empty title returns HTTP 422. Unknown project IDs return HTTP 404. Adding an optional response field is compatible; renaming issue_id needs a versioned migration.
      Persist using the [issue data model](../data-model/issues.md) and add cases to the [test plan](../development/testing.md).
  - path: "data-model/issues.md"
    type: "Reference"
    title: "Issue and outbox data model"
    description: "Define durable issue fields and the outbox relationship used for notifications."
    tags: ["data-model", "architecture"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Records
      An issue has issue_id, project_id, title, version, created_at and updated_at. issue_id is immutable; updates increment version for optimistic concurrency.
      An outbox event has event_id, issue_id, event_type, payload and delivered_at. Both the issue and its creation event commit together.
      ## Change rules
      Never reuse a deleted issue ID. Schema changes use expand-and-contract migrations: introduce a compatible field before removing its predecessor.
      This follows the [storage decision](../decisions/postgresql.md) and supports the [create contract](../api/issues.md).
  - path: "development/local-setup.md"
    type: "Guide"
    title: "Local development setup"
    description: "Prepare the fictional Atlas development environment without changing shared infrastructure."
    tags: ["development", "onboarding"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Prerequisites
      The example stack uses Node.js, PostgreSQL and Redis; choose versions from the real repository's lockfiles and runtime declarations when adapting this guide.
      Copy the repository's example environment file to a local untracked file, start local dependencies, apply migrations, and run the API and worker in separate terminals. This starter bundle contains documentation, not the application or its scripts.
      ## Verify
      Create a test issue and confirm a worker delivery in the local environment. Run the [test plan](testing.md) before opening a PR. Never point a local test at production.
      Read [project ownership](../project/overview.md) when a required command or secret is missing.
  - path: "development/testing.md"
    type: "Guide"
    title: "API and worker test plan"
    description: "Cover transaction, idempotency and notification behavior before accepting an Atlas change."
    tags: ["testing", "quality"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Required checks
      Test the issue insert and outbox insert as one transaction, including a forced rollback. Test notification retries and duplicate event delivery.
      The compatibility test must cover HTTP 409 for an idempotency key reused with a different payload.
      ## Evidence
      Record the commit, command and result in the PR; a green local unit test does not establish production health. For a new migration, test both the previous and new application version against the expanded schema.
      Use the [API contract](../api/issues.md) as the oracle and the [release checklist](../delivery/release.md) for rollout gates.
  - path: "delivery/release.md"
    type: "Runbook"
    title: "Release and rollback checklist"
    description: "Prepare a reviewed rollout with compatibility evidence, health checks and a rollback boundary."
    tags: ["release", "rollback"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Before rollout
      Identify the release commit and owner, complete the [test plan](../development/testing.md), review schema compatibility, and name the previous working artifact. Confirm the actual deployment commands with the platform owner.
      ## After rollout
      Check create-issue success rate and outbox lag. Roll back if create-issue errors exceed the agreed release threshold for five minutes; record the real threshold before using this checklist.
      A rollback reuses the previous application artifact and keeps additive schema changes. Do not reverse a destructive migration without a separate recovery plan.
      Update [architecture documentation](../architecture/system.md) when topology changes, and record the result and evidence in the release report.
