id: "product-management"
title: "Atlas product management"
description: "Connect user problems, product requirements, scope decisions and post-release evidence."
roles: ["product-manager", "project-manager", "founder"]
schemas:
  Decision: {"owner": {"type": "string", "required": true}, "project_id": "string", "decision_status": {"type": "string", "required": true, "enum": ["proposed", "accepted", "superseded"]}}
  Guide: {"owner": "string", "project_id": "string", "audience": "string"}
  Report: {"owner": {"type": "string", "required": true}, "project_id": "string", "period_start": {"type": "date", "required": true}, "period_end": {"type": "date", "required": true}, "as_of": {"type": "date", "required": true}}
  Requirement: {"owner": "string", "project_id": "string"}
  Research: {"owner": "string", "project_id": "string"}
  Roadmap: {"owner": "string", "project_id": "string"}
  Strategy: {"owner": "string", "project_id": "string"}
vocabulary: {"strategy": [], "product": [], "research": [], "evidence": [], "requirements": [], "acceptance": [], "roadmap": [], "planning": [], "decision": [], "scope": [], "report": []}
documents:
  - path: "product/vision.md"
    type: "Strategy"
    title: "Atlas product vision"
    description: "State the target user and product outcome that guide prioritization."
    tags: ["strategy", "product"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Target user and outcome
      Atlas serves small engineering teams that lose track of issue ownership during handoffs.
      The product outcome is fewer unowned issues after a handoff, not simply more notification messages.
      The current milestone focuses on reliable notifications. Read the [research findings](../research/handoff-interviews.md), [PRD](../requirements/notification-reliability.md), and [roadmap](../planning/roadmap.md) before proposing additional features.
  - path: "research/handoff-interviews.md"
    type: "Research"
    title: "Handoff interview findings"
    description: "Keep the sample size, observed problem and limits of customer research explicit."
    tags: ["research", "evidence"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Fictional study
      Three fictional team leads described missed handoffs when issue ownership was unclear.
      Two described duplicate notifications as distracting; one asked for digest emails. These examples demonstrate evidence capture and are not market validation.
      ## Interpretation
      The sample supports exploring clearer ownership and reliable notifications, but it does not establish willingness to pay or demand across the market.
      The [PRD](../requirements/notification-reliability.md) links the selected problem to acceptance criteria; the [scope decision](../decisions/defer-digest.md) records what was deferred.
  - path: "requirements/notification-reliability.md"
    type: "Requirement"
    title: "Notification reliability PRD"
    description: "Specify user outcomes, acceptance criteria and exclusions for the Atlas notification milestone."
    tags: ["requirements", "acceptance"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Problem and outcome
      An issue assignee must receive one notification for one assignment event, even if the worker retries delivery.
      ## Acceptance criteria
      Replaying an assignment event must not send a second notification. Pending retry age must be visible to the operating team. The owner can trace a notification back to its source issue and event.
      ## Out of scope
      Digest emails and channel preferences are out of scope for M1.
      Sources: [research](../research/handoff-interviews.md), [product vision](../product/vision.md), and [scope decision](../decisions/defer-digest.md).
  - path: "planning/roadmap.md"
    type: "Roadmap"
    title: "Atlas outcome roadmap"
    description: "Order reliability work before new notification modes and expose its release dependency."
    tags: ["roadmap", "planning"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Sequence
      First: reliable event delivery and monitoring. Next: ownership handoff improvements. Later: evaluate digest emails after usage evidence is available.
      M1 release readiness depends on retry-age monitoring review.
      ## Review rule
      Treat this sequence as a planning decision, not an immutable delivery promise. Record changed assumptions and source evidence in the [decision log](../decisions/defer-digest.md).
      The [release review](../reports/m1-review.md) records what has actually been verified.
  - path: "decisions/defer-digest.md"
    type: "Decision"
    title: "Defer digest emails after M1"
    description: "Record why one requested feature was deferred and when to revisit it."
    tags: ["decision", "scope"]
    fields: {"owner": "atlas-team", "project_id": "atlas", "decision_status": "accepted"}
    body: |
      ## Decision and rationale
      Digest emails are deferred to protect the M1 notification reliability scope.
      One fictional interview request is insufficient to displace the retry correctness and monitoring acceptance criteria. Revisit digest delivery after measuring actual notification usage and support feedback.
      ## Sources
      Read [research limitations](../research/handoff-interviews.md), the [PRD](../requirements/notification-reliability.md), and [roadmap](../planning/roadmap.md).
  - path: "reports/m1-review.md"
    type: "Report"
    title: "M1 product acceptance review"
    description: "Distinguish passed behavior checks from missing monitoring evidence and unmeasured outcomes."
    tags: ["report", "acceptance"]
    fields: {"owner": "atlas-team", "project_id": "atlas", "period_start": "2026-10-12", "period_end": "2026-10-16", "as_of": "2026-10-14"}
    body: |
      ## Evidence cutoff
      This review covers 2026-10-12 through 2026-10-16, using a fictional snapshot as of 2026-10-14.
      Duplicate-event behavior passed the example review; retry-age monitoring evidence is still missing.
      ## Outcome limits
      No production adoption or customer satisfaction data is attached. Do not report an improvement in retention, revenue or handoff quality from the behavior test alone.
      Next: obtain monitoring evidence, then review acceptance against the [PRD](../requirements/notification-reliability.md) and [research problem](../research/handoff-interviews.md).
questions:
  - question: "Who is Atlas for?"
    source: "product/vision"
    evidence: "small engineering teams that lose track of issue ownership during handoffs"
  - question: "How much interview evidence is available?"
    source: "research/handoff-interviews"
    evidence: "Three fictional team leads"
  - question: "What must happen when an assignment event is replayed?"
    source: "requirements/notification-reliability"
    evidence: "Replaying an assignment event must not send a second notification."
  - question: "Why were digest emails deferred?"
    source: "decisions/defer-digest"
    evidence: "protect the M1 notification reliability scope"
  - question: "What acceptance evidence is missing?"
    source: "reports/m1-review"
    evidence: "retry-age monitoring evidence is still missing"
workflows:
  - id: "write-prd"
    title: "Write a source-backed PRD"
    description: "Turn a user problem into testable acceptance criteria and explicit exclusions."
    steps: ["Read the vision and research, including sample limitations.", "Draft the problem, outcome, acceptance criteria and exclusions; cite the supporting evidence.", "Review scope against the roadmap and record an authorized decision when priorities change."]
    sources: ["product/vision", "research/handoff-interviews", "requirements/notification-reliability"]
  - id: "review-priorities"
    title: "Review product priorities"
    description: "Expose the tradeoff and evidence behind a roadmap change."
    steps: ["Read the roadmap, current requirements and deferred decision.", "Compare candidate work against the agreed outcome and distinguish demand evidence from anecdote.", "Prepare a decision brief with alternatives and missing evidence; update planning records only within authorization."]
    sources: ["planning/roadmap", "decisions/defer-digest", "research/handoff-interviews"]
  - id: "assess-release"
    title: "Assess product acceptance"
    description: "Check release claims against requirements and the evidence cutoff."
    steps: ["Read every acceptance criterion and its available result.", "List passed, failed and unverified criteria without treating missing data as success.", "Write the review with source links, reporting period and follow-up owners; keep customer outcome claims separate from technical checks."]
    sources: ["requirements/notification-reliability", "reports/m1-review"]
