id: "engineering-lead"
title: "Atlas engineering leadership"
description: "Manage technical decisions, ownership, debt, delivery risks and engineering reports with traceable evidence."
roles: ["tech-lead", "engineering-manager"]
schemas:
  Guide: {"owner": "string", "project_id": "string", "audience": "string"}
  Policy: {"owner": {"type": "string", "required": true}, "project_id": "string", "effective_from": "date"}
  RFC: {"owner": "string", "project_id": "string"}
  Reference: {"owner": "string", "project_id": "string"}
  Report: {"owner": {"type": "string", "required": true}, "project_id": "string", "period_start": {"type": "date", "required": true}, "period_end": {"type": "date", "required": true}, "as_of": {"type": "date", "required": true}}
  Risk: {"owner": {"type": "string", "required": true}, "project_id": "string", "risk_status": {"type": "string", "required": true, "enum": ["open", "mitigating", "accepted", "closed"]}}
  Task: {"owner": {"type": "string", "required": true}, "project_id": {"type": "string", "required": true}, "task_status": {"type": "string", "required": true, "enum": ["todo", "in_progress", "blocked", "done", "cancelled"]}, "priority": {"type": "string", "enum": ["high", "normal", "low"]}, "due": "date"}
vocabulary: {"ownership": [], "team": [], "standards": [], "quality": [], "rfc": [], "monitoring": [], "debt": [], "task": [], "capacity": [], "planning": [], "risk": [], "delivery": [], "report": [], "engineering": []}
documents:
  - path: "team/ownership.md"
    type: "Reference"
    title: "Engineering ownership map"
    description: "Locate accountable teams and escalation paths for Atlas engineering work."
    tags: ["ownership", "team"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Accountability
      The api-team owns issue writes, worker correctness and API contracts. The platform-team owns deployment, infrastructure inventory and monitoring pipelines.
      The engineering lead resolves cross-team ownership gaps; ownership does not grant permission to operate a production system.
      Read the [capacity snapshot](capacity.md), [retry RFC](../rfcs/retry-dashboard.md), and [delivery risk](../risks/monitoring-evidence.md) when planning M1.
  - path: "standards/change-review.md"
    type: "Policy"
    title: "Engineering change review standard"
    description: "Define the review evidence needed for compatibility, operational impact and document updates."
    tags: ["standards", "quality"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Review standard
      A behavior-changing PR must link its requirement or decision, include test evidence and identify any documentation that needs updating.
      Changes to retry behavior need an idempotency case and a failure case. Production-facing changes also name an operational owner and rollback boundary.
      ## Record decisions
      Use the [RFC](../rfcs/retry-dashboard.md) for an unresolved design tradeoff and the [debt record](../debt/dashboard-query.md) for accepted cleanup work. An accepted RFC does not itself authorize a deployment.
  - path: "rfcs/retry-dashboard.md"
    type: "RFC"
    title: "Retry-age dashboard RFC"
    description: "Compare two monitoring definitions before accepting a dashboard implementation."
    tags: ["rfc", "monitoring"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Question and options
      Option A measures time since the last retry attempt. Option B measures age of the oldest still-pending event.
      The proposed dashboard uses oldest pending event age because successful recent retries can hide older stuck work.
      ## Validation needed
      This is a proposal, not an accepted implementation. Obtain the real query and test it with an old pending event plus a recent successful event.
      See the [review standard](../standards/change-review.md), [debt item](../debt/dashboard-query.md), and [risk](../risks/monitoring-evidence.md).
  - path: "debt/dashboard-query.md"
    type: "Task"
    title: "Validate the dashboard query"
    description: "Track technical debt with an owner, evidence gap and measurable completion rule."
    tags: ["debt", "task"]
    fields: {"owner": "leo", "project_id": "atlas", "task_status": "blocked", "priority": "high", "due": "2026-10-16"}
    body: |
      ## Debt and impact
      The dashboard query lacks a checked-in definition and a deterministic old-event test.
      Owner Leo must capture the query, add the test and document its interpretation before this item can close. The item is blocked on a platform export.
      ## Completion
      Review the actual query against the [RFC definition](../rfcs/retry-dashboard.md). A screenshot or verbal statement alone does not establish correctness.
      The [delivery risk](../risks/monitoring-evidence.md) remains open while this task is blocked.
  - path: "team/capacity.md"
    type: "Reference"
    title: "Engineering capacity snapshot"
    description: "Record a bounded planning snapshot without treating it as live availability."
    tags: ["capacity", "planning"]
    fields: {"owner": "atlas-team", "project_id": "atlas"}
    body: |
      ## Fictional week 42 snapshot
      The api-team has two planned engineering days for monitoring review; the platform-team has one planned day for the export and rollout evidence.
      These allocations are planning inputs, not a commitment that work is complete. Production incidents may reduce available time.
      ## Coordination
      Confirm current availability with the team before promising dates. Read [ownership](ownership.md), [the blocked task](../debt/dashboard-query.md), and [the report](../reports/week-42.md).
  - path: "risks/monitoring-evidence.md"
    type: "Risk"
    title: "Monitoring evidence delivery risk"
    description: "Name the milestone risk, mitigation owner and evidence required to close it."
    tags: ["risk", "delivery"]
    fields: {"owner": "atlas-team", "project_id": "atlas", "risk_status": "mitigating"}
    body: |
      ## Risk
      M1 may miss its acceptance review because monitoring evidence is unavailable.
      The mitigation owner is the platform-team. The next action is to export the query and a redacted sample for Leo's validation.
      ## Closure evidence
      Close the risk only when [the dashboard task](../debt/dashboard-query.md) has reviewable evidence and the acceptance reviewer confirms the monitoring criterion.
      Read [ownership](../team/ownership.md) before escalating; a weekly report is not a replacement for task evidence.
  - path: "reports/week-42.md"
    type: "Report"
    title: "Engineering week 42 report"
    description: "Report delivery constraints and technical risk with direct links to source records."
    tags: ["report", "engineering"]
    fields: {"owner": "atlas-team", "project_id": "atlas", "period_start": "2026-10-12", "period_end": "2026-10-16", "as_of": "2026-10-14"}
    body: |
      ## Snapshot
      The fictional report covers 2026-10-12 through 2026-10-16, with evidence through 2026-10-14.
      The highest delivery risk is the missing monitoring query, not the amount of remaining implementation work.
      ## Evidence and request
      The [debt task](../debt/dashboard-query.md) is blocked. The [risk](../risks/monitoring-evidence.md) names the mitigation owner, and the [capacity snapshot](../team/capacity.md) describes planned time.
      Request the platform export and confirm review capacity. Do not assign an unmeasured probability to meeting the milestone.
questions:
  - question: "Who owns worker correctness?"
    source: "team/ownership"
    evidence: "The api-team owns issue writes, worker correctness and API contracts."
  - question: "What must a behavior-changing PR include?"
    source: "standards/change-review"
    evidence: "link its requirement or decision, include test evidence"
  - question: "Which monitoring definition does the RFC propose?"
    source: "rfcs/retry-dashboard"
    evidence: "oldest pending event age"
  - question: "Why is the dashboard debt task blocked?"
    source: "debt/dashboard-query"
    evidence: "blocked on a platform export"
  - question: "What is the highest reported delivery risk?"
    source: "reports/week-42"
    evidence: "the missing monitoring query"
workflows:
  - id: "review-rfc"
    title: "Review a technical RFC"
    description: "Evaluate the problem, alternatives and validation plan before accepting a design."
    steps: ["Read the proposed RFC, relevant standards and ownership map.", "Check rejected options, operational impact and the evidence needed to validate the claim.", "Write the review outcome with unresolved questions; record an accepted decision only after the designated reviewer approves it."]
    sources: ["rfcs/retry-dashboard", "standards/change-review", "team/ownership"]
  - id: "triage-debt"
    title: "Triage technical debt and risk"
    description: "Connect cleanup work to its delivery impact and evidence-based priority."
    steps: ["Query Task and Risk records, inspect blockers and named owners.", "Compare impact, next action and planned capacity; identify missing estimates instead of inventing them.", "Update authorized records and their links, preserving the history behind accepted tradeoffs."]
    sources: ["debt/dashboard-query", "risks/monitoring-evidence", "team/capacity"]
  - id: "engineering-report"
    title: "Prepare an engineering leadership report"
    description: "Summarize delivery, capacity and technical risks from current source records."
    steps: ["Choose the reporting period and evidence cutoff.", "Read tasks, RFCs, ownership and risks; verify whether previous report claims are still current.", "Write a report with explicit requests, source IDs and uncertainties; avoid converting planned capacity into completed output."]
    sources: ["reports/week-42", "risks/monitoring-evidence", "team/capacity"]
