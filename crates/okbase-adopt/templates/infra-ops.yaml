  - question: "Which services share app-01?"
    source: "servers/app-01"
    evidence: "app-01 hosts atlas-api and atlas-worker in production."
  - question: "What is the previous working application version?"
    source: "runbooks/rollback-api"
    evidence: "the previous working application artifact is 1.4.1"
  - question: "Is the cause of INC-07 confirmed?"
    source: "incidents/inc-07"
    evidence: "the causal mechanism remains unconfirmed"
  - question: "What should the postmortem investigate next?"
    source: "postmortems/inc-07"
    evidence: "compare connection-pool settings between 1.4.1 and 1.4.2"
workflows:
  - id: "map-impact"
    title: "Trace infrastructure impact"
    description: "Identify the affected environment, services, servers and owners before taking action."
    steps: ["Query Service records by environment and server_id, then read their dependency links.", "Cross-check the selected service against its Server and Environment records.", "Report affected components, owners and evidence gaps; do not infer current live health from inventory."]
    sources: ["environments/production", "servers/app-01", "services/api", "services/worker"]
  - id: "review-deployment"
    title: "Review a deployment and rollback plan"
    description: "Collect the target, artifact, policy and recovery boundary for an authorized operator."
    steps: ["Read the change policy, service mapping and proposed deployment record.", "Verify the previous artifact, staging evidence and rollback boundary with the real platform tooling.", "Prepare or update the deployment record within write authorization; execution and approval remain with the configured host tools."]
    sources: ["policies/production-changes", "runbooks/deploy-api", "runbooks/rollback-api", "deployments/api-1-4-2"]
  - id: "investigate-incident"
    title: "Investigate and record an incident"
    description: "Connect a service incident to timestamped evidence, hypotheses and follow-up work."
    steps: ["Read service dependencies, the latest deployment and the incident timeline.", "Collect authorized redacted logs and metrics; separate observations from causal hypotheses.", "Update the incident and postmortem with source timestamps, verified outcomes and owner-assigned follow-up actions."]
    sources: ["incidents/inc-07", "postmortems/inc-07", "services/database", "deployments/api-1-4-2"]
