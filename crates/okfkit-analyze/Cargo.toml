[package]
name = "okfkit-analyze"
description = "Text analysis for okfkit: Unicode folding, Vietnamese accent stripping, Japanese tokenization."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
unicode-normalization.workspace = true
thiserror.workspace = true
lindera = { workspace = true, optional = true }
lingua = { workspace = true, optional = true }
rust-stemmers.workspace = true
ureq = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["ja", "ja-download", "detect"]
## Japanese tokenization with lindera; the IPADIC dictionary is loaded from the user cache.
ja = ["dep:lindera", "dep:serde_json"]
## Download and build the IPADIC dictionary on first use (rustls, checksum-verified).
ja-download = ["ja", "dep:ureq", "dep:flate2", "dep:tar", "dep:md5"]
## Embed the IPADIC dictionary in the binary (~58 MB; for builds that must work offline).
ja-embedded = ["ja", "lindera/embed-ipadic"]
## Language detection hints (vi/en/ja) with lingua.
detect = ["dep:lingua"]
