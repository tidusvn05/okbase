[package]
name = "okfkit-analyze"
description = "Text analysis for okfkit: Unicode folding, Vietnamese accent stripping, Japanese tokenization."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
unicode-normalization.workspace = true
lindera = { workspace = true, optional = true, features = ["embed-ipadic"] }
lingua = { workspace = true, optional = true }
rust-stemmers.workspace = true

[features]
default = ["ja", "detect"]
## Japanese tokenization with lindera and the embedded IPADIC dictionary.
ja = ["dep:lindera"]
## Language detection hints (vi/en/ja) with lingua.
detect = ["dep:lingua"]
