[package]
name = "okfkit"
description = "okfkit: make markdown knowledge bundles (Open Knowledge Format) work well for AI agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
okfkit-core.workspace = true
okfkit-standard.workspace = true
okfkit-analyze.workspace = true
okfkit-index.workspace = true
okfkit-query.workspace = true
okfkit-lint.workspace = true
thiserror.workspace = true
serde.workspace = true
okfkit-data.workspace = true
tempfile.workspace = true
okfkit-embed.workspace = true
okfkit-search.workspace = true
okfkit-tune.workspace = true
blake3.workspace = true
serde_json.workspace = true
toml_edit.workspace = true

[features]
## Local embedding models (EmbeddingGemma, bge-m3) through ONNX Runtime.
embed-local = ["okfkit-embed/local"]
## An OpenAI-compatible embeddings API.
embed-api = ["okfkit-embed/api"]
## Fine-tuning: train and export through a private Python environment.
embed-tune = ["okfkit-tune/train"]
## Embed the Japanese dictionary instead of downloading it on first use.
ja-embedded = ["okfkit-analyze/ja-embedded"]

[[example]]
name = "retrieval_eval"
required-features = ["embed-local"]

[dev-dependencies]
