[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.1-dev"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["The okbase contributors"]
repository = "https://github.com/tidusvn05/okbase"
homepage = "https://github.com/tidusvn05/okbase"
keywords = ["markdown", "knowledge-base", "mcp", "agents", "okf"]
categories = ["command-line-utilities", "text-processing"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
okbase-core = { path = "crates/okbase-core", version = "0.1.1-dev" }
okbase-standard = { path = "crates/okbase-standard", version = "0.1.1-dev" }
okbase-analyze = { path = "crates/okbase-analyze", version = "0.1.1-dev" }
okbase-index = { path = "crates/okbase-index", version = "0.1.1-dev" }
okbase-query = { path = "crates/okbase-query", version = "0.1.1-dev" }
okbase-lint = { path = "crates/okbase-lint", version = "0.1.1-dev" }
okbase-adopt = { path = "crates/okbase-adopt", version = "0.1.1-dev" }
okbase-search = { path = "crates/okbase-search", version = "0.1.1-dev" }
okbase-embed = { path = "crates/okbase-embed", version = "0.1.1-dev" }
okbase-data = { path = "crates/okbase-data", version = "0.1.1-dev" }
okbase-mcp = { path = "crates/okbase-mcp", version = "0.1.1-dev" }
okbase-skills = { path = "crates/okbase-skills", version = "0.1.1-dev" }
okbase-tune = { path = "crates/okbase-tune", version = "0.1.1-dev" }
okbase-convert = { path = "crates/okbase-convert", version = "0.1.1-dev" }
okbase = { path = "crates/okbase", version = "0.1.1-dev" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "1.3"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
proptest = "1"
unicode-normalization = "0.1"
lindera = { version = "6", default-features = false }
lingua = { version = "1.8", default-features = false, features = ["english", "japanese", "vietnamese"] }
rust-stemmers = "1.2"
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = { version = "1.8", default-features = false, features = ["std"] }
ignore = "0.4"
anydoc = "0.2.4"
pdf-inspector = "1.25"
htmd = "0.5"
markup5ever_rcdom = "0.38"
lopdf = { version = "0.45", default-features = false }
crc32fast = "1"
fax = "0.3"
tempfile = "3"
rmcp = { version = "~3.5", default-features = false, features = ["server", "transport-io"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "signal"] }
schemars = "1"
toml_edit = "0.25"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
anyhow = "1"
assert_cmd = "2"
csv = "1.4"
fastembed = { version = "7.1", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = "1"
tar = "0.4"
md5 = "0.8"
calamine = { version = "0.36", default-features = false }
insta = { version = "1", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
